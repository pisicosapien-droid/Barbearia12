<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbearia - Seu Estilo, Sua Experiência</title>
    
    <!-- Real-time Font Preconnect & Import to prevent FOUT (Flash of Unstyled Text) and guarantee cross-browser compatibility -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght=0,400;0,700;1,400&family=JetBrains+Mono&display=swap" rel="stylesheet">

    <script>
      // Garante que a página do GitHub Pages tenha barra no final do caminho para evitar erro de assets relativos (404)
      if (window.location.hostname.endsWith('.github.io') && 
          !window.location.pathname.endsWith('/') && 
          !window.location.pathname.split('/').pop().includes('.')) {
        window.location.replace(window.location.href + '/');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
